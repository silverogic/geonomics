name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Run daily at 00:00 UTC (9:00 AM KST/JST) to keep stock charts up to date
    - cron: '0 0 * * *'

# Sets permissions of the GITHUB_TOKEN to allow committing built docs
permissions:
  contents: write

# Allow one concurrent build, queuing runs if one is in progress
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        env:
          VITE_STOCK_PROXY_URL: ${{ vars.VITE_STOCK_PROXY_URL }}
        run: npm run build

      - name: Commit and push built docs to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ public/api/v1/ public/data/
          git diff --staged --quiet || (git commit -m "chore: update docs production build [skip ci]" && git pull --rebase origin main && git push)
