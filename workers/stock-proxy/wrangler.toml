name = "geonomics-stock-proxy"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Comma-separated list of allowed browser origins (localhost is always allowed for dev)
ALLOWED_ORIGINS = "https://silverogic.github.io"

# Optional D1 database binding for real-time visitor counting (?visit=1):
# 1) Run: npx wrangler d1 create geonomics-visitors
# 2) Uncomment below and paste your database_id, then run: npx wrangler deploy
# [[d1_databases]]
# binding = "VISITOR_DB"
# database_name = "geonomics-visitors"
# database_id = "316f87f3-c9a1-4101-a7c1-c18afc765c19""
